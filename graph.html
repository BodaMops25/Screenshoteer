<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css">
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
</head>
<body>

  <div id="chart"></div>

  <script>

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max)
  }

  function lerp(from, to, t) {
    return (to - from) * t + from
  }

  transitionTime = 1000
  startValue = 0, endValue = 0
  startDate = 0

  function updateTransition(gotValue) {
    startValue = getTransitionValue()
    endValue = gotValue
    startDate = +new Date()
  }

  function getTransitionValue() {
    const dateDelta = new Date() - startDate

    if(dateDelta > transitionTime) return endValue

    const t = dateDelta / transitionTime
    return lerp(startValue, endValue, t)
  }

  // data: [xAxis, series1]
  let data = [
    [], // time
    []  // values
  ];

  let opts = {
    title: "Real-Time Graph",
    width: 1190,
    height: 300,
    scales: { y: {range: [0, 100]}, x: { time: false } },
    series: [
      {},
      { stroke: "black" }
    ]
  };

  let chart = new uPlot(opts, data, document.getElementById("chart"));

  // simulate incoming data
  let idx = 0;
  setInterval(() => {
    data[0].push(idx++);
    data[1].push(
      getTransitionValue()
    )

    if (data[0].length > 400) {
      data[0].shift();
      data[1].shift();
    }

    chart.setData(data);
  }, 1);

  setInterval(() => {
    updateTransition(Math.random() * 100)
  }, 100)
  </script>

</body>
</html>
