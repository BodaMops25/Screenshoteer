<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WLED color correction</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: rgb(128 128 128);
      transition: background-color 60ms linear;
    }

    main {
      width: min(1100px, 94vw);
      padding: clamp(20px, 4vw, 48px);
      border: 1px solid rgb(255 255 255 / 25%);
      border-radius: 24px;
      background: rgb(0 0 0 / 58%);
      box-shadow: 0 20px 80px rgb(0 0 0 / 35%);
      backdrop-filter: blur(18px);
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
    }

    #status {
      font-weight: 700;
    }

    .channel {
      display: grid;
      grid-template-columns: 72px 1fr 76px;
      align-items: center;
      gap: 18px;
      margin: 26px 0;
    }

    label,
    output {
      font-size: 24px;
      font-weight: 800;
    }

    output {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      height: 64px;
      margin: 0;
      cursor: crosshair;
      accent-color: var(--channel-color);
    }

    .red { --channel-color: #ff3b30; }
    .green { --channel-color: #34c759; }
    .blue { --channel-color: #0a84ff; }
    .hue { --channel-color: #ffcc00; }
    .saturation { --channel-color: #bf5af2; }
    .value { --channel-color: #f2f2f7; }

    .divider {
      height: 1px;
      margin: 34px 0;
      background: rgb(255 255 255 / 20%);
    }

    #hex {
      margin-top: 30px;
      text-align: center;
      font: 800 clamp(28px, 5vw, 54px) ui-monospace, monospace;
      letter-spacing: .08em;
    }

    @media (max-width: 600px) {
      .channel {
        grid-template-columns: 54px 1fr 58px;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>WLED color correction</h1>
      <span id="status">Connecting…</span>
    </header>

    <div class="channel red">
      <label for="red">Red</label>
      <input id="red" type="range" min="0" max="255" step="1" value="128">
      <output for="red">128</output>
    </div>

    <div class="channel green">
      <label for="green">Green</label>
      <input id="green" type="range" min="0" max="255" step="1" value="128">
      <output for="green">128</output>
    </div>

    <div class="channel blue">
      <label for="blue">Blue</label>
      <input id="blue" type="range" min="0" max="255" step="1" value="128">
      <output for="blue">128</output>
    </div>

    <div class="divider"></div>

    <div class="channel hue">
      <label for="hue">Hue</label>
      <input id="hue" type="range" min="0" max="360" step="1" value="0">
      <output for="hue">0</output>
    </div>

    <div class="channel saturation">
      <label for="saturation">Sat</label>
      <input id="saturation" type="range" min="0" max="100" step="1" value="0">
      <output for="saturation">0</output>
    </div>

    <div class="channel value">
      <label for="value">Value</label>
      <input id="value" type="range" min="0" max="100" step="1" value="50">
      <output for="value">50</output>
    </div>

    <div id="hex">#808080</div>
  </main>

  <script>
    const rgbChannels = ['red', 'green', 'blue']
    const hsvChannels = ['hue', 'saturation', 'value']
    const inputs = Object.fromEntries(
      [...rgbChannels, ...hsvChannels].map(
        (channel) => [channel, document.querySelector(`#${channel}`)],
      ),
    )
    const status = document.querySelector('#status')
    const hex = document.querySelector('#hex')
    const socket = new WebSocket('ws://192.168.1.2:8081')

    function getColor() {
      return Object.fromEntries(
        rgbChannels.map((channel) => [channel, Number(inputs[channel].value)]),
      )
    }

    function rgbToHsv({ red, green, blue }) {
      const r = red / 255
      const g = green / 255
      const b = blue / 255
      const maximum = Math.max(r, g, b)
      const minimum = Math.min(r, g, b)
      const difference = maximum - minimum
      let hue = Number(inputs.hue.value)

      if (difference !== 0) {
        if (maximum === r) hue = 60 * (((g - b) / difference) % 6)
        else if (maximum === g) hue = 60 * ((b - r) / difference + 2)
        else hue = 60 * ((r - g) / difference + 4)
      }

      if (hue < 0) hue += 360

      return {
        hue: Math.round(hue),
        saturation: Math.round(maximum === 0 ? 0 : difference / maximum * 100),
        value: Math.round(maximum * 100),
      }
    }

    function hsvToRgb(hue, saturation, value) {
      const s = saturation / 100
      const v = value / 100
      const chroma = v * s
      const hueSection = hue / 60
      const secondary = chroma * (1 - Math.abs(hueSection % 2 - 1))
      const match = v - chroma
      let red = 0
      let green = 0
      let blue = 0

      if (hueSection < 1) [red, green, blue] = [chroma, secondary, 0]
      else if (hueSection < 2) [red, green, blue] = [secondary, chroma, 0]
      else if (hueSection < 3) [red, green, blue] = [0, chroma, secondary]
      else if (hueSection < 4) [red, green, blue] = [0, secondary, chroma]
      else if (hueSection < 5) [red, green, blue] = [secondary, 0, chroma]
      else [red, green, blue] = [chroma, 0, secondary]

      return {
        red: Math.round((red + match) * 255),
        green: Math.round((green + match) * 255),
        blue: Math.round((blue + match) * 255),
      }
    }

    function setInputs(color) {
      for (const [channel, value] of Object.entries(color)) {
        inputs[channel].value = value
        inputs[channel].nextElementSibling.value = value
      }
    }

    function renderAndSend() {
      const color = getColor()
      const values = rgbChannels.map((channel) => color[channel])

      document.body.style.backgroundColor = `rgb(${values.join(' ')})`
      hex.textContent = `#${values
        .map((value) => value.toString(16).padStart(2, '0'))
        .join('')
        .toUpperCase()}`

      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(color))
      }
    }

    function updateFromRgb() {
      setInputs(getColor())
      setInputs(rgbToHsv(getColor()))
      renderAndSend()
    }

    function updateFromHsv() {
      setInputs({
        hue: Number(inputs.hue.value),
        saturation: Number(inputs.saturation.value),
        value: Number(inputs.value.value),
      })
      setInputs(hsvToRgb(
        Number(inputs.hue.value),
        Number(inputs.saturation.value),
        Number(inputs.value.value),
      ))
      renderAndSend()
    }

    for (const channel of rgbChannels) {
      inputs[channel].addEventListener('input', updateFromRgb)
    }

    for (const channel of hsvChannels) {
      inputs[channel].addEventListener('input', updateFromHsv)
    }

    socket.addEventListener('open', () => {
      status.textContent = 'Connected'
      renderAndSend()
    })

    socket.addEventListener('close', () => {
      status.textContent = 'Disconnected'
    })

    socket.addEventListener('error', () => {
      status.textContent = 'Connection error'
    })

    socket.addEventListener('message', (event) => {
      const message = JSON.parse(event.data)
      if (message.type === 'error') status.textContent = message.message
    })

    updateFromRgb()
  </script>
</body>
</html>
