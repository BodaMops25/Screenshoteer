<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas></canvas>

  <script>
    const ws = new WebSocket('ws://192.168.1.2:8080')
    ws.binaryType = 'arraybuffer'

    const cnvs = document.querySelector('canvas')
    const ctx = cnvs.getContext('2d')

    function resizeCanvas() {
      const pixelRatio = window.devicePixelRatio || 1
      cnvs.width = Math.round(innerWidth * pixelRatio)
      cnvs.height = Math.round(innerHeight * pixelRatio)
    }

    function drawPixels(data) {
      const pixelHeight = 40
      const channelCount = 3
      const pixelCount = Math.floor(data.length / channelCount)
      if (pixelCount === 0) return

      const pixelWidth = cnvs.width / pixelCount
      ctx.clearRect(0, 0, cnvs.width, cnvs.height)

      for (let pixelIndex = 0; pixelIndex < pixelCount; pixelIndex++) {
        const byteIndex = pixelIndex * channelCount
        const red = data[byteIndex]
        const green = data[byteIndex + 1]
        const blue = data[byteIndex + 2]

        ctx.fillStyle = `rgb(${red} ${green} ${blue})`
        ctx.fillRect(
          Math.floor(pixelIndex * pixelWidth),
          cnvs.height/2 - pixelHeight/2,
          Math.ceil(pixelWidth),
          pixelHeight,
        )
      }
    }

    resizeCanvas()
    window.addEventListener('resize', resizeCanvas)

    ws.addEventListener('message', (event) => {
      drawPixels(new Uint8Array(event.data))
    })

    ws.addEventListener('error', () => {
      alert('Screenshoteer server not found. Is it running?')
    })
  </script>
</body>
</html>
